.fd { font-family: 'Fredoka', ui-rounded, 'SF Pro Rounded', system-ui, sans-serif; color: ${st}; font-weight: 500; }
.fd button { font-family: inherit; }
.fd-plate { background: #1B1611; color: ${pt}; border-radius: 12px; box-shadow: inset 0 0 0 2px #1B1611, inset 0 0 0 3.5px rgba(244,230,195,.5), 3px 4px 0 rgba(8,6,4,.55); }
.fd-sheet { background: ${pt} radial-gradient(rgba(27,22,17,.07) 1px, transparent 1.4px) 0 0 / 7px 7px; box-shadow: 0 -4px 0 ${st}; }
.fd-btn { border: 3px solid ${st}; border-radius: 14px; box-shadow: 3px 5px 0 ${st}; color: ${st}; font-family: 'Chango', 'Fredoka', sans-serif !important; font-weight: 400; letter-spacing: .02em; transition: transform 70ms ease-out, box-shadow 70ms ease-out; }
.fd-btn:active:not(:disabled) { transform: translate(2px, 4px); box-shadow: 1px 1px 0 ${st}; }
.fd-btn:disabled { opacity: .5; }
.fd-card { background: ${pt}; border: 3px solid ${st}; border-radius: 12px; box-shadow: inset 0 -6px 0 var(--ph), 3px 4px 0 ${st}; transition: transform 90ms ease-out, opacity 120ms; }
.fd-card:active:not([aria-disabled=true]) { transform: translate(2px, 3px); box-shadow: inset 0 -6px 0 var(--ph), 1px 1px 0 ${st}; }
.fd-pill { border-radius: 999px; padding: 0 9px; font-size: 12px; font-weight: 600; line-height: 20px; white-space: nowrap; }
.fd-scroll { scrollbar-width: none; } .fd-scroll::-webkit-scrollbar { display: none; }
