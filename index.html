.fd { font-family: 'Fredoka', ui-rounded, 'SF Pro Rounded', system-ui, sans-serif; color: ${it}; font-weight: 500; }
.fd button { font-family: inherit; }

.fd-btn:active:not(:disabled) { transform: translate(2px, 4px); box-shadow: 1px 1px 0 ${it}; }

.fd-scroll { scrollbar-width: none; } .fd-scroll::-webkit-scrollbar { display: none; }
.fd-noselect { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation; }
.fd h1, .fd h2, .fd-title { font-family: 'Chango', 'Fredoka', sans-serif; font-weight: 400 !important; letter-spacing: .01em; }

.fd-hit::after { content: ""; position: absolute; left: 0; right: 0; top: -12px; bottom: -12px; }

@keyframes fd-flip { 0% { transform: rotateY(180deg) } 100% { transform: rotateY(0deg) } }
@keyframes fd-float { 0% { opacity: 0; transform: translate(-50%, 8px) scale(.7) } 15% { opacity: 1; transform: translate(-50%, -8px) scale(1.15) } 30% { transform: translate(-50%, -14px) scale(1) } 100% { opacity: 0; transform: translate(-50%, -52px) } }

@keyframes fd-hold { from { transform: scaleY(0) } to { transform: scaleY(1) } }
@keyframes fd-ring { 0% { opacity: 1; transform: scale(1) } 70% { opacity: 0; transform: scale(1.12) } 100% { opacity: 0; transform: scale(1.12) } }

.fd-ring { animation: fd-ring 1.4s ease-out infinite; }
